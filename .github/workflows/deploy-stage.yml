name: Build & Deploy to ECS (UAT)

on:
  push:
    branches:
      - uat

jobs:
  uat:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout Code
      # ----------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------
      # Set up Java 21
      # ----------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ----------------------------
      # Run Tests (stops on failure)
      # ----------------------------
      - name: Run Tests
        run: mvn test

      # ----------------------------
      # Build JAR
      # ----------------------------
      - name: Build JAR
        run: mvn package -DskipTests
        # ----------------------------
      # Setup SSH Key
      # ----------------------------
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ----------------------------
      # Deploy JAR to EC2
      # ----------------------------
      - name: Deploy JAR to EC2
        run: |
          scp -i ~/.ssh/ec2_key target/*.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/app/

      # ----------------------------
      # Restart Apache Service
      # ----------------------------
      - name: Restart Apache Service
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo systemctl restart httpd"