name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          # Create private key file
          echo "$EC2_KEY" | tr -d '\r' > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Add host to known_hosts
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Test connection
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no \
            $EC2_USER@$EC2_HOST "echo SSH connection successful"

          # Copy jar to EC2
          scp -i ~/.ssh/ec2_key target/*.jar \
            $EC2_USER@$EC2_HOST:/tmp/

          # Move to /opt/app (sudo usually required)
          ssh -i ~/.ssh/ec2_key $EC2_USER@$EC2_HOST \
            "sudo mv /tmp/*.jar /opt/app/"